services:
  - type: web
    name: fra-evidence-map
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd frontend && npm ci && npm run build
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_MODE
        value: demo
      - key: APP_ENV
        value: production
