services:
  - type: web
    name: fra-evidence-map
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd frontend && npm ci && npm run build
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Vite 8 requires Node 20.19+ or 22.12+ during the frontend build.
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_MODE
        value: demo
      - key: APP_ENV
        value: production
